; Configure global logging
[global]
error_log = /usr/local/var/log/php-fpm/error.log

[www]
listen = /usr/local/var/run/php-fpm/www.sock
listen.owner = appuser
listen.group = appuser
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 100

; Logging
access.log = /usr/local/var/log/php-fpm/access.log
slowlog = /usr/local/var/log/php-fpm/slow.log
request_slowlog_timeout = 5s
